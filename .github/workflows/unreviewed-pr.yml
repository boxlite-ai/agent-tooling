name: Unreviewed PR

# Commits UNREVIEWED.md to a pull request that does not already carry that commit, converts
# the pull request to a draft, and fails until a person deletes the file after reading the
# diff and marks it ready. Draft blocks the merge on its own; making "Author reviewed the
# PR" a required check blocks it again for anyone who undrafts without reviewing. A PR
# merged without that brings the file onto the default branch. A consumer copying this file
# copies the script it names.
#
# One head cannot be marked at all: a fork's. The step refuses a fork opened by an owner,
# member or collaborator, since opening from a fork would otherwise be the way around this
# gate, and passes one opened by anyone else, who cannot merge it either. Requiring
# approvals on the base branch is what covers that second case; this workflow does not.
#
# pull_request_target, and a checkout of the base commit alone: this job holds write scopes,
# so it must never run a pull request's own copy of the workflow or the script. Checking out
# the head, or switching back to pull_request, hands those scopes to the pull request.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  statuses: write
  pull-requests: write

concurrency:
  group: unreviewed-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  unreviewed-file:
    name: Author reviewed the PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Add or check UNREVIEWED.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash plugins/boxlite-agent-tooling/scripts/pr-unreviewed-file.sh "$GITHUB_EVENT_PATH"
